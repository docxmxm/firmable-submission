[project]
name = "firmable-schema-inference"
version = "0.1.0"
description = "Bounded schema-inference agent and deterministic company data pipeline"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    "pypdf>=6,<7",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["firmable_runtime*"]
